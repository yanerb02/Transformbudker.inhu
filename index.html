*{box-sizing:border-box}
html,body{margin:0;padding:0;font-family:'Inter',-apple-system,'Segoe UI',Roboto,sans-serif}
body{background:var(--paper);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,.tab,th,.brand-text strong,.kpi-label,.section-eyebrow,.btn,label.f{font-family:'Manrope',-apple-system,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:0 28px}

.top-row{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;position:relative;z-index:1}
.brand{display:flex;align-items:center;gap:12px}
.brand-mark{width:42px;height:42px;border-radius:10px;background:var(--gold);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--teal-900);font-size:17px;flex-shrink:0;font-family:Manrope,sans-serif}
.brand-text{font-size:13px;color:#cfe1db}.brand-text strong{display:block;color:#fff;font-size:15px;font-weight:700}
.top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.period-pill{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);padding:6px 12px;border-radius:100px;font-size:12.5px;color:#e4efec;white-space:nowrap}
.period-pill select{background:transparent;border:0;color:#fff;font:inherit;font-weight:600;outline:0;cursor:pointer}
.period-pill select option{color:#122622}
.pill-btn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:100px;padding:7px 14px;font-size:12.5px;cursor:pointer;font-family:inherit}
.pill-btn:hover{background:rgba(255,255,255,.22)}
.nav{display:flex;gap:8px;margin-top:22px;position:relative;z-index:1;flex-wrap:wrap;align-items:center}
.nav .nb{background:transparent;border:1px solid rgba(255,255,255,.28);color:#e4efec;border-radius:100px;padding:8px 16px;font:600 13px Manrope,sans-serif;cursor:pointer}
.nav .nb.on{background:var(--gold);border-color:var(--gold);color:var(--teal-900)}
.nav .sp{flex:1}
.hero-title{font-size:31px;font-weight:800;margin:26px 0 8px;max-width:680px;letter-spacing:-.01em;line-height:1.2;color:#fff;position:relative;z-index:1}
.slim .hero-title{font-size:25px;margin-top:20px}
.hero-sub{font-size:15px;color:#c9ded7;max-width:600px;margin:0;position:relative;z-index:1}
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:-58px;position:relative;z-index:2}
.kpi-card{background:var(--paper-card);border-radius:14px;padding:20px 20px 18px;box-shadow:var(--shadow);border:1px solid var(--line)}
.kpi-label{font-size:12px;color:var(--ink-soft);font-weight:600;margin:0 0 8px}
.kpi-value{font-size:23px;font-weight:800;color:var(--teal-900);letter-spacing:-.01em;font-family:Manrope,sans-serif}
.kpi-sub{font-size:12.5px;color:var(--ink-soft);margin-top:4px}.kpi-sub.good{color:var(--good)}.kpi-sub.bad{color:var(--bad)}
main{padding:76px 0 40px}main.input{padding-top:28px}
section{margin-bottom:52px}
.section-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.section-eyebrow{font-size:12.5px;font-weight:700;color:var(--gold);letter-spacing:.02em;margin:0 0 4px}
.section-title{font-size:21px;font-weight:800;margin:0;color:var(--teal-900)}
.section-note{font-size:13px;color:var(--ink-soft);max-width:420px;text-align:right;margin:0}
.panel{background:var(--paper-card);border-radius:16px;border:1px solid var(--line);box-shadow:var(--shadow);padding:26px}
.chart-grid{display:grid;grid-template-columns:1.6fr 1fr;gap:28px}
.barchart{display:flex;height:270px;gap:8px;position:relative;padding-left:56px}
.gridlines{position:absolute;left:56px;right:0;top:22px;bottom:34px}
.gridline{position:absolute;left:0;right:0;border-top:1px dashed var(--line)}
.gridline span{position:absolute;left:-58px;top:-8px;width:52px;text-align:right;font-size:10px;color:var(--ink-soft);white-space:nowrap}
.bar-col{flex:1;position:relative;height:270px;min-width:0}
.bar-stack{position:absolute;bottom:34px;left:50%;transform:translateX(-50%);width:80%;max-width:52px;height:214px;display:flex;flex-direction:column-reverse;border-radius:4px 4px 0 0;overflow:hidden}
.bar-seg:hover{opacity:.75}
.bar-month-label{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--ink-soft);font-weight:600;white-space:nowrap}
.bar-total-label{position:absolute;bottom:256px;left:50%;transform:translateX(-50%);font-size:10.5px;color:var(--teal-900);font-weight:700;white-space:nowrap}
table.tight{font-size:12.5px}table.tight thead th,table.tight tbody td{padding:10px 7px}table.tight tbody td.name{min-width:150px;max-width:190px}
.baseline-line{position:absolute;left:0;right:0;border-top:2px dashed var(--gold);z-index:2}.baseline-label{position:absolute;right:0;top:-18px;font-size:10.5px;font-weight:700;color:var(--gold);background:var(--paper-card);padding:1px 6px;border-radius:4px;white-space:nowrap}
.chip-legend{display:flex;flex-wrap:wrap;gap:10px 16px;margin-top:18px}
.chip-legend .chip{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-soft)}.chip-legend .dot{width:8px;height:8px;border-radius:2px}
.donut-wrap{display:flex;flex-direction:column;align-items:center}
.donut{width:180px;height:180px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#e5e9e7}
.donut-hole{width:106px;height:106px;border-radius:50%;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1px var(--line)}
.donut-hole .v{font-size:15px;font-weight:800;color:var(--teal-900);font-family:Manrope,sans-serif}
.donut-hole .l{font-size:9.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.03em}
.legend-list{display:flex;flex-direction:column;gap:9px;margin-top:18px;font-size:12.5px;width:100%}
.legend-item{display:flex;align-items:center;justify-content:space-between;gap:8px}
.legend-left{display:flex;align-items:center;gap:8px}.legend-dot{width:9px;height:9px;border-radius:50%}
.legend-val{font-weight:700;color:var(--teal-900)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.tab{border:1px solid var(--line);background:#fff;padding:8px 14px;border-radius:100px;font-size:12.5px;font-weight:600;color:var(--ink-soft);cursor:pointer}
.tab:hover{border-color:var(--teal-500);color:var(--teal-800)}.tab.active{background:var(--teal-800);border-color:var(--teal-800);color:#fff}
.cat-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:22px}
.mini-stat{background:var(--teal-100);border-radius:12px;padding:16px 18px}
.mini-stat .k{font-size:11.5px;color:var(--teal-800);font-weight:700;margin-bottom:6px}
.mini-stat .v{font-size:19px;font-weight:800;color:var(--teal-900);font-family:Manrope,sans-serif}
.linechart-wrap{margin-bottom:26px}.linechart-wrap svg{width:100%;height:220px;overflow:visible}
.lc-dot{fill:#fff;stroke-width:2.5}.lc-label{font-size:10.5px;fill:var(--ink-soft)}.lc-val{font-size:10.5px;font-weight:700;font-family:Manrope,sans-serif}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{text-align:left;padding:10px 12px;font-size:11.5px;font-weight:700;color:var(--ink-soft);border-bottom:1.5px solid var(--line);white-space:nowrap}
thead th.num,td.num{text-align:right;white-space:nowrap}
tbody td{padding:11px 12px;border-bottom:1px solid var(--line)}
tbody tr:hover{background:#faf9f4}tbody td.name{font-weight:600;min-width:200px}
.rank-badge{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:6px;background:var(--teal-100);color:var(--teal-800);font-size:11.5px;font-weight:700}
.trend-chip,.chip-s{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:100px;font-size:11.5px;font-weight:700;white-space:nowrap}
.trend-chip.good,.chip-s.ok{background:var(--good-bg);color:var(--good)}.trend-chip.bad,.chip-s.no{background:var(--bad-bg);color:var(--bad)}.trend-chip.na{background:#eef0ee;color:#7b8a86}

.search-box input{border:none;outline:none;font-size:13px;width:100%;font-family:inherit;color:var(--ink)}
.table-scroll{overflow-x:auto}
.note-banner{background:var(--gold-soft);border:1px solid #d8b876;color:#5c4210;border-radius:12px;padding:14px 18px;font-size:13px;margin-bottom:28px;display:flex;gap:10px}
.empty-msg{padding:22px;text-align:center;color:var(--ink-soft);font-size:13px}

.mu.A{background:var(--teal-700)}.mu.B{background:var(--teal-500)}.mu.C{background:var(--gold)}.mu.D{background:var(--bad)}

input.t,select.t{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:14px;background:#fff;color:var(--ink)}

input.t.err{border-color:var(--bad);background:#fff7f5}
.btn{background:var(--teal-800);color:#fff;border:0;border-radius:10px;padding:12px 18px;font-size:14px;font-weight:700;cursor:pointer}
.btn:hover{background:var(--teal-700)}.btn:disabled{opacity:.6}.btn.full{width:100%;margin-top:18px}
.btn.ghost{background:#fff;color:var(--teal-800);border:1px solid var(--teal-800)}
.chk{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--ink-soft);margin-top:12px}
.warn{background:var(--gold-soft);border:1px solid #d8b876;color:#5c4210;border-radius:10px;padding:9px 12px;font-size:12.5px;margin-top:14px}
.form-panel{margin-bottom:22px}
h4.fg{margin:20px 0 4px;font-size:13px;color:var(--teal-800);text-transform:uppercase;letter-spacing:.03em}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 20px}
.tot{margin-top:16px;padding:12px 16px;border-radius:10px;background:var(--teal-100);font-size:14px;color:var(--teal-900);display:flex;justify-content:space-between;gap:10px}
.prow{display:grid;grid-template-columns:1fr 170px 38px;gap:8px;margin-bottom:8px}
.x{border:0;background:var(--bad-bg);color:var(--bad);border-radius:10px;font-size:18px;cursor:pointer}
.hint{font-size:12px;color:var(--ink-soft);margin:6px 0 0}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#122622;color:#fff;padding:11px 18px;border-radius:10px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:99;max-width:90vw;text-align:center}#toast.on{opacity:1}
@media (max-width:820px){.bar-total-label{font-size:8.5px;letter-spacing:-.2px}.bar-month-label{font-size:9.5px}.barchart{padding-left:46px;gap:4px}.gridlines{left:46px}.gridline span{left:-48px;width:42px;font-size:9px}.wrap{padding:0 16px}.kpi-row{grid-template-columns:repeat(2,1fr);gap:10px}.kpi-card{padding:14px}.kpi-value{font-size:19px}.chart-grid,.cat-summary,.skm-grid,.form-grid{grid-template-columns:1fr}.hero-title{font-size:25px}.section-note{text-align:left}.panel{padding:18px}.prow{grid-template-columns:1fr 120px 38px}}

</style>

const mods = u => String(u.modul||'').split(',').filter(Boolean);
const has = (u,m) => mods(u).includes(m);
const pdUsers = () => ST.users.filter(u=>u.peran==='pd');
const keuUsers = () => pdUsers().filter(u=>has(u,'keu'));
const skmUsers = () => pdUsers().filter(u=>has(u,'skm'));
const R = (p,k) => (ST.db[p]||{})[k];
const KV = (p,u,f) => { const r=R(p,'keu:'+u); return r&&r.v&&r.v[f]!=null ? (+r.v[f]||0) : null; };
const SUM = (p,fs) => keuUsers().reduce((a,u)=>a+fs.reduce((b,f)=>b+(KV(p,u.u,f)||0),0),0);
const withData = () => PERIODS.filter(p=>Object.keys(ST.db[p]||{}).length);
const canInput = u => !!u && (u.peran==='admin' || (u.peran==='pd' && mods(u).length>0));
function canWrite(u,key){ if(u.peran==='admin')return true; if(key.indexOf('keu:')===0&&has(u,'keuall'))return true; if(key==='keu:'+u.u)return has(u,'keu'); if(key==='skm:'+u.u)return has(u,'skm'); if(key==='wfh')return has(u,'wfh'); if(key==='prog')return has(u,'prog'); return false; }
function tasks(p){ const t=[]; pdUsers().forEach(u=>{ if(has(u,'keu'))t.push({u,k:'keu:'+u.u,l:'Keuangan'}); if(has(u,'skm'))t.push({u,k:'skm:'+u.u,l:'SKM'}); if(has(u,'wfh'))t.push({u,k:'wfh',l:'WFH/WFO'}); if(has(u,'prog'))t.push({u,k:'prog',l:'Pemanfaatan'}); }); return t.map(x=>{ let r=R(p,x.k), part=false; if(r&&x.k.indexOf('keu:')===0&&!FIELDS.every(f=>r.v&&r.v[f.k]!=null)){ part=true; r=null; } return Object.assign({},x,{r,part}); }); }
function mutu(v){ if(v>=88.31)return['A','Sangat Baik']; if(v>=76.61)return['B','Baik']; if(v>=65)return['C','Kurang Baik']; if(v>=25)return['D','Tidak Baik']; return['D','Tidak Baik']; }
function skmAgg(p){ const L=skmUsers().map(u=>({u,r:R(p,'skm:'+u.u)})).filter(x=>x.r); const rs=L.reduce((a,x)=>a+(+x.r.resp||0),0); const avg=!L.length?null:(rs>0?L.reduce((a,x)=>a+x.r.ikm*x.r.resp,0)/rs:L.reduce((a,x)=>a+x.r.ikm,0)/L.length); return {L,rs,avg}; }
function trend(v,pv,good){ if(v==null||pv==null)return '<span class="trend-chip na">–</span>'; if(v===pv)return '<span class="trend-chip na">0%</span>'; const d=v-pv, pct=pv!==0?Math.abs(d/pv*100):100, up=d>0, ok=(good==='up')===up; return '<span class="trend-chip '+(ok?'good':'bad')+'">'+(up?'&#8593;':'&#8595;')+' '+nf(pct,0)+'%</span>'; }

/* ================= API (cloud / uji coba) ================= */
async function call(action,payload){
  if(!CLOUD_URL) return local(action,payload||{});
  const body=Object.assign({action,u:ST.cred.u,p:ST.cred.p},payload||{});
  const r=await fetch(CLOUD_URL,{method:'POST',body:JSON.stringify(body)});
  return r.json();
}
function local(a,pay){
  const U=ROSTER.find(x=>x.u===ST.cred.u);
  if(!U||!U.l||ST.cred.p!=='demo') return {ok:false,msg:'Username atau password salah'};
  let db={}; try{db=JSON.parse(localStorage.getItem('tbk_demo')||'{}');}catch(e){}
  if(a==='login'||a==='all') return {ok:true,me:U,users:ROSTER,db};
  if(a==='save'){ if(!canWrite(U,pay.key))return {ok:false,msg:'Tidak berhak mengisi bagian ini'}; (db[pay.period]=db[pay.period]||{})[pay.key]=pay.rec; localStorage.setItem('tbk_demo',JSON.stringify(db)); return {ok:true}; }
  if(a==='saveall'){ for(const it of pay.items){ if(!canWrite(U,it.key))return {ok:false,msg:'Tidak berhak mengisi bagian ini'}; } pay.items.forEach(it=>{ (db[pay.period]=db[pay.period]||{})[it.key]=it.rec; }); localStorage.setItem('tbk_demo',JSON.stringify(db)); return {ok:true}; }
  return {ok:false};
}
function applyAll(r){ ST.me=r.me; ST.users=(r.users&&r.users.length)?r.users:ROSTER; ST.db=r.db||{}; }
async function reload(){ const r=await call('all'); if(!r.ok)throw new Error(r.msg||'Gagal memuat'); applyAll(r); }

async function doLogin(){

function kpiHtml(p){
  const T=tasks(p), done=T.filter(t=>t.r).length, pct=T.length?Math.round(done/T.length*100):0;
  const incomplete=new Set(T.filter(t=>!t.r).map(t=>t.u.u)).size;
  const sav=SUM(p,SAVE_KEYS), pp=prevP(p), hasPrev=Object.keys(ST.db[pp]||{}).length>0, psav=SUM(pp,SAVE_KEYS);
  let sub='Listrik, BBM, air, telepon, operasional, lainnya', cls='';
  if(hasPrev&&psav>0){ const d=(sav-psav)/psav*100; sub=(d>=0?'&#9650; ':'&#9660; ')+nf(Math.abs(d),1)+'% dibanding '+BLN[+pp.split('-')[1]-1]; cls=d>=0?'good':'bad'; }
  const w=R(p,'wfh'), ag=skmAgg(p);
  const c=[
   {l:'Laporan Masuk',v:done+' / '+T.length,s:pct+'% &middot; '+incomplete+' PD belum lengkap',c:pct===100?'good':''},
   {l:'Total Penghematan',v:rp(sav,true),s:sub,c:cls},
   {l:'Komposisi ASN (WFH : WFO)',v:w?nf(w.wfh,1)+'% : '+nf(w.wfo,1)+'%':'&ndash;',s:w?'Data '+pl(p):'Belum ada data bulan ini',c:''},
   {l:'Indeks Kepuasan (IKM)',v:ag.avg==null?'&ndash;':nf(ag.avg,2),s:ag.avg==null?'Belum ada data bulan ini':mutu(ag.avg)[1]+' &middot; '+th(ag.rs)+' responden',c:''}
  ];
  return c.map(x=>'<div class="kpi-card"><p class="kpi-label">'+x.l+'</p><div class="kpi-value">'+x.v+'</div><div class="kpi-sub '+x.c+'">'+x.s+'</div></div>').join('');
}
function sumHtml(p){

  '<div class="donut-wrap"><div class="donut" style="'+(T?'background:conic-gradient('+st.join(',')+')':'')+'"><div class="donut-hole"><div class="v">'+rp(T,true)+'</div><div class="l">'+ps(p)+'</div></div></div><div class="legend-list">'+vals.map(x=>'<div class="legend-item"><div class="legend-left"><span class="legend-dot" style="background:'+x.c+'"></span><span>'+x.f.i+' '+x.f.s+'</span></div><span class="legend-val">'+(T?nf(x.v/T*100,1)+'%':'0%')+'</span></div>').join('')+'</div></div>';

function lineChart(vals,labels,color){
  const w=640,h=200,L=46,Rr=16,Tp=16,B=28,mx=Math.max.apply(null,vals.concat([1])),pw=w-L-Rr,ph=h-Tp-B,n=vals.length;
  const x=i=>L+(n===1?pw/2:pw*i/(n-1)), y=v=>Tp+ph-(v/mx)*ph, pts=vals.map((v,i)=>[x(i),y(v)]);
  const line=pts.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+','+q[1].toFixed(1)).join(' ');
  const area=line+' L'+pts[n-1][0].toFixed(1)+','+(Tp+ph)+' L'+pts[0][0].toFixed(1)+','+(Tp+ph)+' Z';
  let g=''; for(let i=0;i<=3;i++){ const gy=Tp+ph-i/3*ph; g+='<line x1="'+L+'" y1="'+gy.toFixed(1)+'" x2="'+(w-Rr)+'" y2="'+gy.toFixed(1)+'" stroke="#e3ded0" stroke-dasharray="3,3"/><text x="'+(L-6)+'" y="'+(gy+3).toFixed(1)+'" text-anchor="end" class="lc-label">'+rp(mx*i/3,true)+'</text>'; }
  return '<svg viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="xMidYMid meet">'+g+'<path d="'+area+'" fill="'+color+'22"/><path d="'+line+'" fill="none" stroke="'+color+'" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>'+
   pts.map((q,i)=>'<circle class="lc-dot" cx="'+q[0].toFixed(1)+'" cy="'+q[1].toFixed(1)+'" r="4" stroke="'+color+'"><title>'+labels[i]+': '+rp(vals[i])+'</title></circle><text x="'+q[0].toFixed(1)+'" y="'+(q[1]-10).toFixed(1)+'" text-anchor="middle" class="lc-val" fill="'+color+'">'+rp(vals[i],true)+'</text>').join('')+
   labels.map((l,i)=>'<text x="'+x(i).toFixed(1)+'" y="'+(h-6)+'" text-anchor="middle" class="lc-label">'+l+'</text>').join('')+'</svg>';
}

  '<div class="linechart-wrap">'+chart+'</div><div class="search-box"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="opacity:.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><input type="text" id="q" placeholder="Cari nama Perangkat Daerah..." value="'+esc(ST.q)+'" oninput="ST.q=this.value;$(\'#catBody\').innerHTML=catRows()"></div>'+

}

/* ================= REALISASI BELANJA (data historis dari rekap Excel) ================= */
const HCOL=['#1b5e56','#c08a2e','#3d7a8f','#7a5c3d','#5e7a3d','#8f4b3d'], HMIN=0.8;
const HS={BBM:'BBM',AIR:'Air',GAS:'Gas',LISTRIK:'Listrik',KEND:'Kend. Dinas',SPPD:'SPPD'};
const hName=u=>{ const x=ROSTER.find(r=>r.u===u); return x?x.nama:u; };
const hv=(k,u,i)=>{ const a=HIST.d[k][u]; return a?a[i]:null; };
const hSum=(k,i)=>HIST.pd.reduce((s,u)=>s+(hv(k,u,i)||0),0);
const hGrand=i=>HIST.cats.reduce((s,c)=>s+hSum(c.k,i),0);
const hCov=i=>{ let c=0; HIST.cats.forEach(ct=>HIST.pd.forEach(u=>{ if(hv(ct.k,u,i)!=null)c++; })); return c/(HIST.cats.length*HIST.pd.length); };
const hMon=()=>HIST.months.map((m,i)=>i).filter(i=>hCov(i)>=HMIN);   // bulan yang datanya hampir lengkap
const hLbl=i=>ps(HIST.months[i]), hFull=i=>pl(HIST.months[i]);
function histRange(){ const m=hMon(); return hFull(m[0])+' – '+hFull(m[m.length-1]); }
function histView(){
  return '<div class="wrap"><div class="kpi-row">'+safe('KPI',hKpi)+'</div></div><main class="wrap">'+safe('catatan',hBanner)+
  '<section><div class="section-head"><div><p class="section-eyebrow">RINGKASAN</p><h2 class="section-title">Tren Realisasi Belanja per Bulan</h2></div><p class="section-note">Garis putus-putus emas adalah ambang batas realisasi bulan Maret sebagai pembanding bulan-bulan berikutnya.</p></div><div class="panel chart-grid">'+safe('grafik',hOverview)+'</div></section>'+
  '<section><div class="section-head"><div><p class="section-eyebrow">RINCIAN KATEGORI</p><h2 class="section-title">Belanja per Kategori &amp; Perangkat Daerah</h2></div><p class="section-note">Pilih kategori untuk melihat tren bulanan dan peringkat Perangkat Daerah. Kolom &ldquo;&ndash;&rdquo; berarti belum diisi.</p></div><div class="panel">'+safe('kategori',hCat)+'</div></section>'+
  '<section><div class="section-head"><div><p class="section-eyebrow">KEBERHASILAN PENGHEMATAN</p><h2 class="section-title">Perangkat Daerah yang Berhasil Hemat</h2></div><p class="section-note">Realisasi bulan pembanding dibandingkan ambang batas Maret, gabungan enam kategori belanja.</p></div><div class="panel">'+safe('peringkat',hRank)+'</div></section></main>';
}
function hKpi(){
  const ms=hMon(), f=ms[0], l=ms[ms.length-1], tot=ms.reduce((s,i)=>s+hGrand(i),0), g0=hGrand(f), g1=hGrand(l), d=g0?(g1-g0)/g0*100:0;
  const top=HIST.cats.map(c=>({c,t:ms.reduce((s,i)=>s+hSum(c.k,i),0)})).sort((a,b)=>b.t-a.t)[0];
  const c=[
   {l:'Total Realisasi '+ms.length+' Bulan',v:rp(tot,true),s:histRange()+' &middot; '+HIST.cats.length+' kategori',c:''},
   {l:'Perubahan '+hLbl(f)+' &rarr; '+hLbl(l),v:(d<=0?'&#8595; ':'&#8593; ')+nf(Math.abs(d),1)+'%',s:rp(g0,true)+' &rarr; '+rp(g1,true),c:d<=0?'good':'bad'},
   {l:'Kategori Belanja Terbesar',v:esc(top.c.l),s:rp(top.t,true)+' total',c:''},
   {l:'Jumlah Perangkat Daerah',v:HIST.pd.length,s:'melapor realisasi belanja',c:''}
  ];
  return c.map(x=>'<div class="kpi-card"><p class="kpi-label">'+x.l+'</p><div class="kpi-value" style="'+(String(x.v).length>14?'font-size:17px;line-height:1.25':'')+'">'+x.v+'</div><div class="kpi-sub '+x.c+'">'+x.s+'</div></div>').join('');
}
function hBanner(){
  const ms=hMon(), part=HIST.months.map((m,i)=>i).filter(i=>ms.indexOf(i)<0);
  let t='Grafik dan peringkat memakai bulan yang datanya sudah hampir lengkap, yaitu <b>'+histRange()+'</b>.';
  if(part.length) t+=' Belum ditampilkan karena baru sebagian PD menginput: '+part.map(i=>hFull(i)+' ('+Math.round(hCov(i)*100)+'% terisi)').join(', ')+'.';

function hOverview(){

  g+=`<div class="baseline-line" style="bottom:${base/mx*100}%"><span class="baseline-label">Ambang batas &middot; ${hFull(ms[0])} ${rp(base,true)}</span></div>`;

  const vals=HIST.cats.map((c,ci)=>({c,col:HCOL[ci],v:ms.reduce((s,i)=>s+hSum(c.k,i),0)})).sort((a,b)=>b.v-a.v), T=vals.reduce((s,x)=>s+x.v,0)||1;

  `<div class="donut-wrap"><div class="donut" style="background:conic-gradient(${st.join(',')})"><div class="donut-hole"><div class="v">${rp(T,true)}</div><div class="l">Total</div></div></div><div class="legend-list">${vals.map(x=>`<div class="legend-item"><div class="legend-left"><span class="legend-dot" style="background:${x.col}"></span><span>${x.c.i} ${esc(x.c.l)}</span></div><span class="legend-val">${nf(x.v/T*100,1)}%</span></div>`).join('')}</div></div>`;
}
let HROWS=[];
function hCat(){
  const ms=hMon(), k=HIST.cats.some(c=>c.k===ST.hcat)?ST.hcat:HIST.cats[0].k, ci=HIST.cats.findIndex(c=>c.k===k), c=HIST.cats[ci];

  return `<div class="tabs">${tabs}</div><div class="cat-summary"><div class="mini-stat"><div class="k">TOTAL ${ms.length} BULAN &middot; ${c.i} ${esc(c.l.toUpperCase())}</div><div class="v">${rp(tot,true)}</div></div><div class="mini-stat"><div class="k">RATA-RATA PER BULAN</div><div class="v">${rp(tot/ms.length,true)}</div></div><div class="mini-stat"><div class="k">KONTRIBUTOR TERBESAR</div><div class="v" style="font-size:14px;line-height:1.3">${esc(top)}</div></div></div>`+

function hRows(){

function hRank(){
  const ms=hMon(); if(ms.length<2) return '<div class="empty-msg">Perlu minimal dua bulan data.</div>';
  const cmp=(ms.indexOf(ST.hm)>0)?ST.hm:ms[ms.length-1];
  const rows=HIST.pd.map(u=>({u,b:HIST.cats.reduce((s,c)=>s+(hv(c.k,u,ms[0])||0),0),cur:HIST.cats.reduce((s,c)=>s+(hv(c.k,u,cmp)||0),0),has:HIST.cats.some(c=>hv(c.k,u,cmp)!=null)})).filter(r=>r.has&&r.b>0);
  const hemat=rows.filter(r=>r.cur<r.b).map(r=>Object.assign({},r,{s:r.b-r.cur,p:(r.b-r.cur)/r.b*100})).sort((a,b)=>b.s-a.s), tot=hemat.reduce((s,r)=>s+r.s,0);
  const sel=`<div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap"><label class="f" style="margin:0">Bulan pembanding</label><select class="t" style="width:auto" onchange="ST.hm=+this.value;render()">${ms.slice(1).map(i=>`<option value="${i}"${i===cmp?' selected':''}>${hFull(i)}</option>`).join('')}</select></div>`;
  const sm=`<div class="cat-summary"><div class="mini-stat"><div class="k">PD BERHASIL HEMAT</div><div class="v">${hemat.length} dari ${rows.length} PD</div></div><div class="mini-stat"><div class="k">TOTAL PENGHEMATAN (vs ${hFull(ms[0]).split(' ')[0]})</div><div class="v">${rp(tot,true)}</div></div><div class="mini-stat"><div class="k">RATA-RATA PENGHEMATAN</div><div class="v">${hemat.length?rp(tot/hemat.length,true):'Rp 0'}</div></div></div>`;
  const tb=hemat.length?`<div class="table-scroll"><table><thead><tr><th style="width:36px"></th><th>Perangkat Daerah</th><th class="num">Baseline (${hLbl(ms[0])})</th><th class="num">Realisasi ${hLbl(cmp)}</th><th class="num">Penghematan (Rp)</th><th class="num">Penghematan (%)</th></tr></thead><tbody>${hemat.map((r,n)=>`<tr><td><span class="rank-badge">${n+1}</span></td><td class="name">${esc(hName(r.u))}</td><td class="num">${rp(r.b)}</td><td class="num">${rp(r.cur)}</td><td class="num" style="font-weight:700;color:var(--good)">${rp(r.s)}</td><td class="num"><span class="trend-chip good">&#8595; ${nf(r.p,0)}%</span></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty-msg">Belum ada Perangkat Daerah dengan realisasi di bawah baseline pada bulan ini.</div>';

}

  return '<p class="hint">Pilih jenis data, isi nominal rupiah tiap Perangkat Daerah, lalu simpan. Kolom kosong berarti belum diisi; isi 0 jika memang tidak ada.</p>'+
  '<label class="f">Jenis data</label><select class="t" onchange="ST.kf=this.value;render()">'+FIELDS.map(x=>'<option value="'+x.k+'"'+(x.k===f.k?' selected':'')+'>'+(x.l?x.l+'. ':'')+x.t+' ('+filled(x.k)+'/'+ku.length+' PD)</option>').join('')+'</select>'+
  '<div class="table-scroll" style="margin-top:12px"><table id="f-ka"><thead><tr><th>No.</th><th>Perangkat Daerah</th><th class="num">Nominal (Rp)</th></tr></thead><tbody>'+ku.map((u,i)=>{ const v=KV(p,u.u,f.k); return '<tr><td>'+(i+1)+'</td><td class="name">'+esc(u.nama)+'</td><td style="min-width:170px"><input class="t rp" inputmode="numeric" data-u="'+u.u+'" placeholder="–" value="'+(v!=null?th(v):'')+'" oninput="fmtKa(this)"></td></tr>'; }).join('')+'</tbody></table></div>'+
  '<div class="tot"><span>Total</span><b id="kaTot">Rp 0</b></div><button class="btn full" onclick="saveKeuAll()">Simpan data ini</button>';
}
function fmtKa(el){ const d=el.value.replace(/\D/g,''); el.value=d?th(d):''; kaTot(); }
function kaTot(){ let s=0; document.querySelectorAll('#f-ka input[data-u]').forEach(i=>{ s+=num(i.value); }); const e=$('#kaTot'); if(e)e.textContent=rp(s); }
async function saveKeuAll(){
  const p=ST.period,k=ST.kf,me=ST.me,items=[],at=new Date().toISOString(), by=me.peran==='admin'?'Admin (atas nama BPKAD)':me.nama;
  document.querySelectorAll('#f-ka input[data-u]').forEach(i=>{ if(i.value.trim()==='')return; const key='keu:'+i.dataset.u, old=R(p,key); const v=Object.assign({},old&&old.v||{}); v[k]=num(i.value); items.push({key,rec:{v,by,at}}); });
  if(!items.length) return toast('Belum ada nominal yang diisi');
  try{
    const res=await call('saveall',{period:p,items});
    if(!res.ok) return toast(res.msg||'Gagal menyimpan');
    items.forEach(it=>{ (ST.db[p]=ST.db[p]||{})[it.key]=it.rec; }); toast(items.length+' PD tersimpan ✔'); render();
  }catch(e){ toast('Gagal menyimpan: periksa koneksi internet'); }
}
function keuForm(t,p){
  const r=R(p,'keu:'+t.u), v=(r&&r.v)||{};
  const grp=(title,fs)=>'<h4 class="fg">'+title+'</h4><div class="form-grid">'+fs.map(f=>'<div><label class="f">'+(f.l?f.l+'. ':'')+f.t+'</label><input class="t rp" inputmode="numeric" data-k="'+f.k+'" placeholder="0" value="'+(r&&v[f.k]!=null?th(v[f.k]):'')+'" oninput="fmtIn(this)"></div>').join('')+'</div>';
  return '<p class="hint">Isi dalam rupiah. Isi 0 jika tidak ada.</p><div id="f-keu">'+grp('Perjalanan dinas &amp; kendaraan',FIELDS.filter(f=>!f.h))+grp('Penghematan',HEMAT)+'</div><div class="tot"><span>Total penghematan (G&ndash;L)</span><b id="keuTot">Rp 0</b></div><button class="btn full" onclick="saveKeu(\''+t.u+'\')">'+(r?'Perbarui laporan':'Kirim laporan')+'</button>';
}
function fmtIn(el){ const d=el.value.replace(/\D/g,''); el.value=d?th(d):''; el.classList.remove('err'); keuTot(); }
function keuTot(){ let s=0; document.querySelectorAll('#f-keu input[data-k]').forEach(i=>{ if(SAVE_KEYS.includes(i.dataset.k)) s+=num(i.value); }); const e=$('#keuTot'); if(e)e.textContent=rp(s); }
async function saveKeu(uid){
  const v={}; let bad=null;
  document.querySelectorAll('#f-keu input[data-k]').forEach(i=>{ if(i.value.trim()===''){ bad=bad||i; i.classList.add('err'); } else v[i.dataset.k]=num(i.value); });
  if(bad){ bad.focus(); return toast('Lengkapi semua kolom (isi 0 jika tidak ada)'); }
  await save('keu:'+uid,{v});
}
function skmForm(t,p){ const r=R(p,'skm:'+t.u)||{}; return '<div class="form-grid"><div><label class="f">Nilai IKM (0&ndash;100)</label><input class="t" id="s-ikm" inputmode="decimal" placeholder="mis. 85,40" value="'+(r.ikm!=null?String(r.ikm).replace('.',','):'')+'"></div><div><label class="f">Jumlah responden</label><input class="t" id="s-resp" inputmode="numeric" placeholder="mis. 120" value="'+(r.resp!=null?r.resp:'')+'"></div></div><button class="btn full" onclick="saveSkm(\''+t.u+'\')">'+(r.ikm!=null?'Perbarui laporan':'Kirim laporan')+'</button>'; }
async function saveSkm(uid){
  const ikm=dec($('#s-ikm').value), resp=num($('#s-resp').value);
  if(ikm==null||ikm<0||ikm>100) return toast('Nilai IKM harus 0–100');
  if(!resp) return toast('Isi jumlah responden');
  await save('skm:'+uid,{ikm:Math.round(ikm*100)/100,resp});
}
function wfhForm(p){ const r=R(p,'wfh')||{}; return '<p class="hint">Isi total persentase dalam satu bulan, bukan per hari. WFO terisi otomatis.</p><div class="form-grid"><div><label class="f">WFH (%)</label><input class="t" id="w-a" inputmode="decimal" value="'+(r.wfh!=null?String(r.wfh).replace('.',','):'')+'" oninput="wfSync()"></div><div><label class="f">WFO (%)</label><input class="t" id="w-b" inputmode="decimal" value="'+(r.wfo!=null?String(r.wfo).replace('.',','):'')+'"></div></div><button class="btn full" onclick="saveWfh()">'+(r.wfh!=null?'Perbarui laporan':'Kirim laporan')+'</button>'; }
function wfSync(){ const a=dec($('#w-a').value); $('#w-b').value=a==null?'':String(Math.round((100-a)*100)/100).replace('.',','); }
async function saveWfh(){
  const a=dec($('#w-a').value), b=dec($('#w-b').value);
  if(a==null||b==null) return toast('Isi persentase WFH dan WFO');
  if(a<0||b<0||Math.abs(a+b-100)>0.01) return toast('WFH + WFO harus berjumlah 100%');
  await save('wfh',{wfh:a,wfo:b});
}
function progForm(p){
  if(!ST.pr){ const r=R(p,'prog'); ST.pr=(r&&r.rows&&r.rows.length)?r.rows.map(x=>({n:x.n,v:x.v})):[{n:'',v:''}]; }
  const r=R(p,'prog');
  return '<p class="hint">Isi program/kegiatan/sub kegiatan beserta anggarannya.</p><div id="prRows"></div><button class="btn ghost" onclick="prAdd()">+ Tambah baris</button><div class="tot"><span>Total anggaran</span><b id="prTot">Rp 0</b></div><button class="btn full" onclick="saveProg()">'+(r?'Perbarui laporan':'Kirim laporan')+'</button>';
}
function prDraw(){ $('#prRows').innerHTML=ST.pr.map((x,i)=>'<div class="prow"><input class="t" placeholder="Program/Kegiatan/Sub Kegiatan" value="'+esc(x.n)+'" oninput="ST.pr['+i+'].n=this.value"><input class="t" inputmode="numeric" placeholder="Rp" value="'+(x.v===''?'':th(x.v))+'" oninput="prVal('+i+',this)"><button class="x" onclick="prDel('+i+')">×</button></div>').join(''); prTot(); }
function prVal(i,el){ const d=el.value.replace(/\D/g,''); ST.pr[i].v=d?+d:''; el.value=d?th(d):''; prTot(); }
function prTot(){ const e=$('#prTot'); if(e)e.textContent=rp(ST.pr.reduce((a,x)=>a+(+x.v||0),0)); }
function prAdd(){ ST.pr.push({n:'',v:''}); prDraw(); }
function prDel(i){ ST.pr.splice(i,1); if(!ST.pr.length)ST.pr.push({n:'',v:''}); prDraw(); }
async function saveProg(){
  const rows=ST.pr.filter(x=>x.n.trim()||x.v!=='').map(x=>({n:x.n.trim(),v:+x.v||0}));
  if(!rows.length||rows.some(x=>!x.n)) return toast('Lengkapi nama program/kegiatan pada setiap baris');
  await save('prog',{rows});
}
async function save(key,rec){
  const p=ST.period, me=ST.me;
  const tgt=ST.users.find(x=>x.u===ST.target);
  rec.by=me.peran==='admin'?('Admin (atas nama '+(tgt?tgt.nama:'PD')+')'):me.nama; rec.at=new Date().toISOString();
  try{
    const res=await call('save',{period:p,key,rec});
    if(!res.ok) return toast(res.msg||'Gagal menyimpan');
    (ST.db[p]=ST.db[p]||{})[key]=rec; ST.pr=null; toast('Laporan tersimpan ✔'); render();
  }catch(e){ toast('Gagal menyimpan: periksa koneksi internet'); }
}

/* ================= EKSPOR EXCEL ================= */
function exportXlsx(){
  if(typeof XLSX==='undefined') return toast('Pustaka Excel belum termuat (perlu internet)');
  const p=ST.period, wb=XLSX.utils.book_new(), ku=keuUsers(), ms=withData(), used={};
  const add=(n,a,w)=>{ n=n.replace(/[\\\/?*\[\]:]/g,'').slice(0,31); let k=n,i=2; while(used[k])k=n.slice(0,28)+' '+(i++); used[k]=1; const ws=XLSX.utils.aoa_to_sheet(a); if(w)ws['!cols']=w.map(x=>({wch:x})); XLSX.utils.book_append_sheet(wb,ws,k); };
  const wf=R(p,'wfh');
  add('Status Pelaporan',[['Perangkat Daerah','Laporan','Status','Dikirim']].concat(tasks(p).map(t=>[t.u.nama,t.l,t.r?'Sudah':'Belum',t.r?dt(t.r.at):''])),[55,14,10,20]);
  add('A Komposisi ASN',[['Bulan','WFH (%)','WFO (%)'],[pl(p),wf?wf.wfh:'',wf?wf.wfo:'']],[16,10,10]);
  FIELDS.forEach(f=>{ const rows=ku.map((u,i)=>{ const v=KV(p,u.u,f.k); return [i+1,u.nama,v==null?'':v]; }); const tot=ku.reduce((a,u)=>a+(KV(p,u.u,f.k)||0),0); add((f.l||'Perj.Dinas')+' '+f.s,[['No.','Perangkat Daerah',f.h?'Penghematan '+pl(p):f.t+' '+pl(p)]].concat(rows,[['','Total',tot]]),[6,60,24]); });
  const pr=R(p,'prog'); add('M Pemanfaatan',[['No.','Program/Kegiatan/Sub Kegiatan','Anggaran']].concat(((pr&&pr.rows)||[]).map((x,i)=>[i+1,x.n,x.v]),[['','Total',((pr&&pr.rows)||[]).reduce((a,x)=>a+(+x.v||0),0)]]),[6,60,20]);
  add('N SKM',[['Unit Layanan','Bulan','Nilai IKM','Jumlah Responden','Mutu']].concat(skmUsers().map(u=>{ const r=R(p,'skm:'+u.u); return [u.nama,pl(p),r?r.ikm:'',r?r.resp:'',r?mutu(r.ikm)[0]+' - '+mutu(r.ikm)[1]:'']; })),[45,16,10,18,20]);
  add('Rekap Semua PD',[['Perangkat Daerah'].concat(FIELDS.map(f=>(f.l?f.l+'. ':'')+f.s))].concat(ku.map(u=>[u.nama].concat(FIELDS.map(f=>{ const v=KV(p,u.u,f.k); return v==null?'':v; })))),[55].concat(FIELDS.map(()=>18)));
  add('Tren Bulanan',[['Kategori'].concat(ms.map(pl))].concat(FIELDS.map(f=>[(f.l?f.l+'. ':'')+f.s].concat(ms.map(m=>SUM(m,[f.k]))))),[36].concat(ms.map(()=>18)));
  if(HIST){ HIST.cats.forEach(c=>{ const rows=HIST.pd.map(u=>({u,v:HIST.months.map((m,i)=>hv(c.k,u,i))})).sort((a,b)=>b.v.reduce((s,x)=>s+(x||0),0)-a.v.reduce((s,x)=>s+(x||0),0)); add('Belanja '+HS[c.k],[['No.','Perangkat Daerah'].concat(HIST.months.map((m,i)=>pl(m)+(hCov(i)<HMIN?' (sebagian)':'')))].concat(rows.map((r,i)=>[i+1,hName(r.u)].concat(r.v.map(x=>x==null?'':x))),[['','Total'].concat(HIST.months.map((m,i)=>hSum(c.k,i)))]),[6,60].concat(HIST.months.map(()=>16))); }); }
  XLSX.writeFile(wb,'Rekap_TBK_'+p+'.xlsx');
}

/* ================= MULAI ================= */
(async function(){
  let c=null; try{ c=JSON.parse(localStorage.getItem('tbk_c')||sessionStorage.getItem('tbk_c')||'null'); }catch(e){}
  if(c&&c.u){ ST.cred=c; try{ const r=await call('all'); if(r.ok){ applyAll(r); const w=withData(); ST.period=w.length?w[w.length-1]:'2026-10'; return render(); } }catch(e){} ST.cred=null; }
  loginView();
})();
</script>
